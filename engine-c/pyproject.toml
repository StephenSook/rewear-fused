[project]
name = "rewear-engine-c"
version = "0.1.0"
description = "REWEAR-FUSED Digital Recyclability Passport: compliance classifier + DPP + data ETL (Vinh)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "catboost>=1.2",
    "rdkit>=2024.3",
    "requests>=2.32",
    "cryptography>=43",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: model-training tests (deselect with -m 'not slow')"]
